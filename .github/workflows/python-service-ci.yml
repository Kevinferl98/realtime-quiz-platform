name: Python Service CI

on:
  workflow_call:
    inputs:
        service:
            required: true
            type: string
        python-version:
            required: false
            type: string
            default: "3.14"
        
permissions:
  contents: read

jobs:
  lint: 
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Ruff
        run: |
            python -m pip install --upgrade pip
            pip install ruff

      - name: Run lint
        run: ruff check backend/${{ inputs.service }} 

  test:
    name: Tests (${{ inputs.service }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: backend/${{ inputs.service }}/requirements.txt
                
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r backend/${{ inputs.service }}/requirements.txt

      - name: Run tests
        working-directory: backend/${{ inputs.service }} 
        run: |
          python -m pytest tests